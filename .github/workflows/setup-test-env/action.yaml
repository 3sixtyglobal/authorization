name: 'Setup Testing Environment'
description: 'Set up the testing environment for running tests from the build workflow.'

inputs:
  package:
    description: 'The package to set up the test environment for.'
    required: true
    default: 'all'
  test_env_vars:
    description: 'Newline-separated KEY=VALUE pairs to inject as environment variables into the test services.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Start PostgreSQL
      if: inputs.package == 'packages/authorization-connector-entity-storage' || inputs.package == 'all'
      shell: bash
      run: |
        CONTAINER_NAME="3sixty-entity-storage-postgresql"

        docker rm -f "$CONTAINER_NAME" || true
        docker pull postgres:latest

        docker run -d \
          --name "$CONTAINER_NAME" \
          -e POSTGRES_USER=postgres \
          -e POSTGRES_PASSWORD=password \
          -p 5432:5432 \
          postgres:latest

        for i in {1..60}; do
          if docker exec "$CONTAINER_NAME" pg_isready -h 127.0.0.1 -U postgres > /dev/null 2>&1; then
            echo "PostgreSQL is ready."
            exit 0
          fi
          sleep 1
        done

        echo "PostgreSQL did not become ready in time."
        docker logs "$CONTAINER_NAME" || true
        exit 1

    - name: Start Casdoor
      if: inputs.package == 'packages/authorization-connector-casbin' || inputs.package == 'all'
      shell: bash
      run: |
        CONTAINER_NAME="3sixty-authorization-casbin"

        docker rm -f "$CONTAINER_NAME" || true
        docker rmi casbin/casdoor-all-in-one:latest || true
        docker pull casbin/casdoor-all-in-one:latest

        docker run -d \
          --name "$CONTAINER_NAME" \
          -p 48000:8000 \
          casbin/casdoor-all-in-one:latest

        for i in {1..60}; do
          if curl --fail --silent "http://127.0.0.1:48000" > /dev/null; then
            echo "Casdoor is ready."
            exit 0
          fi
          sleep 1
        done

        echo "Casdoor did not become ready in time."
        docker logs "$CONTAINER_NAME" || true
        exit 1
